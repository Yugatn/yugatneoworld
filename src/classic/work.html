<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STNetwork · Work</title><link rel="stylesheet" href="../../style.css"><style>
body{padding:20px}.work{max-width:1100px;margin:auto}.toolbar,.form{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{padding:16px;border:1px solid #56645b;border-radius:12px;background:#35443a}.card button{margin:6px 6px 0 0}.form label{display:grid;gap:4px;min-width:220px}.muted{opacity:.75}.tabs{display:flex;gap:8px;margin:12px 0}
</style></head>
<body><main class="work">
<h1>STNetwork · Work</h1><p class="muted">Classic interface over the same social identity used by eWorld.</p>
<div class="tabs"><button id="jobsTab">Jobs</button><button id="resumeTab">Resume</button><button id="appsTab">Applications</button><a href="../../index.html">eWorld</a></div>
<section id="jobsView"><div class="toolbar"><input id="query" placeholder="Search jobs, skills, companies"><button id="all">All</button><button id="remote">Remote</button><button id="flexible">Flexible</button></div><section id="jobs" class="grid"></section></section>
<section id="resumeView" hidden><h2>My resume</h2><div class="card form"><label>Name<input id="name"></label><label>Headline<input id="headline"></label><label>Skills<input id="skills" placeholder="skill, skill, skill"></label><label>Experience<textarea id="experience"></textarea></label><label>Education<textarea id="education"></textarea></label><label>Projects<textarea id="projects"></textarea></label></div><div class="toolbar"><button id="save">Save private draft</button><button id="publish">Publish resume</button></div><p id="resumeStatus"></p></section>
<section id="appsView" hidden><h2>Applications</h2><section id="apps" class="grid"></section></section>
</main>
<script type="module">
import {loadIdentity,saveIdentity} from "../domain/identity.js";
import {getJobs,updateResume,applyToJob,submitApplication} from "../domain/employment.js";
const identity=loadIdentity(),state=identity.employment,jobs=document.querySelector("#jobs"),apps=document.querySelector("#apps");
const q=document.querySelector("#query");
function renderJobs(filter){jobs.innerHTML="";for(const j of getJobs(state,{mode:filter,query:q.value})){const c=document.createElement("article");c.className="card";c.innerHTML="<h3>"+j.title+"</h3><p>"+j.company+" · "+j.mode+" · "+j.location+"</p><p>"+j.skills.join(" · ")+"</p><button data-id='"+j.id+"'>Open vacancy</button><button data-apply='"+j.id+"'>Apply</button>";jobs.appendChild(c)}}
jobs.onclick=e=>{const id=e.target.dataset.apply;if(id){const app=applyToJob(state,id);saveIdentity(identity);renderApps();document.querySelector("#resumeStatus").textContent="Application "+app.id+" prepared as "+app.status+"."}};
function renderApps(){apps.innerHTML="";for(const a of state.applications){const j=state.jobs.find(x=>x.id===a.jobId);const c=document.createElement("article");c.className="card";c.innerHTML="<h3>"+(j?.title||a.jobId)+"</h3><p>"+(j?.company||"")+" · "+a.status+"</p><p>"+a.createdAt+"</p><button data-submit>Submit</button>";
const b=c.querySelector("[data-submit]"); if(a.status!=="draft"){b.textContent="Submitted";b.disabled=true} b.onclick=()=>{try{submitApplication(state,a.id);saveIdentity(identity);renderApps()}catch(e){alert(e.message)}}; apps.appendChild(c)}}
function fillResume(){const r=state.resume;name.value=identity.displayName;headline.value=r.headline;skills.value=r.skills.join(", ");experience.value=r.experience.join("\n");education.value=r.education.join("\n");projects.value=r.projects.join("\n")}
function collect(){return {headline:headline.value,skills:skills.value.split(",").map(v=>v.trim()).filter(Boolean),experience:experience.value.split("\n").map(v=>v.trim()).filter(Boolean),education:education.value.split("\n").map(v=>v.trim()).filter(Boolean),projects:projects.value.split("\n").map(v=>v.trim()).filter(Boolean)}}
save.onclick=()=>{updateResume(state,collect());state.resume.visibility="private";saveIdentity(identity);resumeStatus.textContent="Private resume draft saved in the shared identity."};
publish.onclick=()=>{updateResume(state,collect());state.resume.visibility="discoverable";saveIdentity(identity);resumeStatus.textContent="Resume marked discoverable. External publication is not performed."};
q.oninput=()=>renderJobs();all.onclick=()=>renderJobs();remote.onclick=()=>renderJobs("remote");flexible.onclick=()=>renderJobs("flexible");
jobsTab.onclick=()=>show("jobs");resumeTab.onclick=()=>show("resume");appsTab.onclick=()=>show("apps");
function show(which){jobsView.hidden=which!=="jobs";resumeView.hidden=which!=="resume";appsView.hidden=which!=="apps";if(which==="resume")fillResume();if(which==="apps")renderApps()}
renderJobs();renderApps();
</script></body></html>
