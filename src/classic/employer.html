<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STNetwork · Employers</title><link rel="stylesheet" href="../../style.css"></head>
<body><main style="max-width:1000px;margin:auto;padding:20px">
<h1>STNetwork · Employers</h1><p>Employer directory shared with the eWorld city layer.</p>
<div id="places"></div><a href="./work.html">Work</a> · <a href="../../index.html">eWorld</a>
</main>
<script type="module">
import{createCityState}from"../domain/city.js";
import{loadIdentity,saveIdentity}from"../domain/identity.js";
import{openEmployerConversation}from"../domain/employment.js";
const state=createCityState(),identity=loadIdentity(),root=document.querySelector("#places");
for(const p of state.places.filter(x=>x.type==="employer")){
 const d=document.createElement("article");d.className="card";d.style.margin="12px 0";
 d.innerHTML="<h2>"+p.name+"</h2><p>"+p.description+"</p><p>Open jobs: "+p.jobs.length+"</p><a class='button' href='./company.html?id="+encodeURIComponent(p.id)+"'>Enter company</a> <button>Follow employer</button> <button>Contact via Eugene</button>";
 d.querySelector("button").onclick=()=>{identity.following=identity.following||[];if(!identity.following.includes(p.id))identity.following.push(p.id);saveIdentity(identity)};
 d.querySelectorAll("button")[1].onclick=()=>{openEmployerConversation(identity.employment,p.id);saveIdentity(identity);alert("Eugene employer conversation requested.")};
 root.appendChild(d);
}
</script></body></html>
