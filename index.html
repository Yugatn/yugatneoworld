<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Yugatn eWorld</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="hud">
      <strong>Yugatn eWorld</strong>
      <span id="status">Connecting…</span>
      <button id="save" type="button">Save</button>
      <button id="reset" type="button">Reset</button>
    </header>
    <section class="world-shell">
      <canvas id="world" aria-label="2D apartment world"></canvas>
      <aside id="panel" class="panel" hidden>
        <h2 id="panel-title"></h2>
        <p id="panel-description"></p>
        <div id="panel-actions"></div>
        <button id="close-panel" type="button">Back to world</button>
      </aside>
    </section>
    <footer class="help">Move: mouse / touch / WASD · E: interact · Esc: close / leave street · Gold ring: proximity · Pink: other users</footer>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
